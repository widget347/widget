<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WeedHack</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  video {
    width: 75vw;
    height: 75vh;
    object-fit: contain;
  }
</style>
</head>
<body>

<video id="video" autoplay loop playsinline>
  <source src="https://raw.githubusercontent.com/widget347/widget/main/video.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>

<script>
  const video = document.getElementById('video');
  video.muted = false;
  video.play();
</script>

</body>
</html>
