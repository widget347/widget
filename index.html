
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weedhack premium beta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a; --bg2: #161312; --ink: #f4efe8; --muted: #9a9086;
    --line: #2a2420; --red: #e31c23;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .kicker {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.18em;
    margin-bottom: 14px;
  }
  h1 {
    font-family: Syne, system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.04em;
    font-size: clamp(32px, 8vw, 46px);
    line-height: 0.95;
    margin: 0 0 30px;
  }
  h1 span { color: var(--red); }

  .join-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 24px;
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    margin-bottom: 26px;
  }
  .join-btn:hover {
    border-color: var(--red);
    color: var(--red);
    background: #1c1211;
  }
  .join-btn::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    display: inline-block;
  }

  .widget-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    overflow: hidden;
  }
  .widget-frame {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
  }

  /* solid full-opacity red bar – 73px + 5% ≈ 77px */
  .topbar-cover {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 77px;
    background: var(--red);
    pointer-events: none;
    z-index: 2;
    clip-path: path(evenodd,
      "M0,0 H1000 V77 H0 Z"
      "M 190,22 H 326 V 55 H 190 Z"
    );
  }

  /* logo – embedded as data URI so it always loads */
  .discord-logo-overlay {
    position: absolute;
    top: 22px;
    left: 16px;
    height: 32px;
    width: auto;
    z-index: 5;
    pointer-events: none;
  }

  .widget-card iframe {
    width: 100%;
    height: 220px;
    border: none;
    display: block;
    filter: grayscale(0.25) hue-rotate(125deg) saturate(1.05) brightness(0.95);
  }

  footer {
    margin-top: 22px;
    color: var(--muted);
    font-size: 11px;
  }
</style>
</head>
