<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>weedhack premium beta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b0a; --bg2: #161312; --ink: #f4efe8; --muted: #9a9086;
    --line: #2a2420; --red: #e31c23; --ok: #3dd68c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .kicker {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.18em;
    margin-bottom: 14px;
  }
  h1 {
    font-family: Syne, system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: -0.04em;
    font-size: clamp(32px, 8vw, 46px);
    line-height: 0.95;
    margin: 0 0 30px;
  }
  h1 span { color: var(--red); }

  .join-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 24px;
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
    margin-bottom: 26px;
  }
  .join-btn:hover {
    border-color: var(--red);
    color: var(--red);
    background: #1c1211;
  }
  .join-btn::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    display: inline-block;
  }

  /* ---- custom status widget (replaces the old iframe embed) ---- */
  .widget-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    text-align: left;
  }

  .w-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .w-avatar {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .w-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .w-id { min-width: 0; flex: 1; }
  .w-name {
    font-family: Syne, system-ui, sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .w-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--red);
    margin-top: 2px;
  }
  .w-pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 0 rgba(227,28,35,.6);
    animation: wpulse 2s infinite;
  }
  .w-pill.off { color: var(--muted); }
  .w-pill.off::before { background: var(--muted); animation: none; box-shadow: none; }
  @keyframes wpulse {
    0%   { box-shadow: 0 0 0 0 rgba(227,28,35,.55); }
    70%  { box-shadow: 0 0 0 5px rgba(227,28,35,0); }
    100% { box-shadow: 0 0 0 0 rgba(227,28,35,0); }
  }

  .w-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
  }
  .w-stat {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    background: #120f0e;
  }
  .w-stat span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .w-stat b {
    font-size: 19px;
    font-weight: 500;
  }

  .w-activity {
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .w-activity b { color: var(--ink); font-weight: 500; }

  footer {
    margin-top: 22px;
    color: var(--muted);
    font-size: 11px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">by widget</div>
    <h1>weed<span>hack</span> premium beta</h1>

    <a class="join-btn" href="https://discord.gg/Y4SgmyaR" target="_blank" rel="noopener">join discord</a>

    <div class="widget-card">
      <div class="w-top">
        <div class="w-avatar" id="wAvatar"><img src="https://i.imgur.com/BtNYRFI.png" alt="server icon"></div>
        <div class="w-id">
          <div class="w-name" id="wName">connecting…</div>
          <div class="w-pill off" id="wPill">checking</div>
        </div>
      </div>

      <div class="w-stats">
        <div class="w-stat"><span>ONLINE</span><b id="wOnline">–</b></div>
        <div class="w-stat"><span>IN VOICE</span><b id="wVoice">–</b></div>
      </div>

      <div class="w-activity" id="wActivity">Loading server status…</div>
    </div>

    <footer>Interdimensional Movement Disabler</footer>
  </div>

<script>
(function () {
  // Same guild ID that was in the original iframe's src.
  const GUILD_ID = "1268898544165589082";
  const POLL_MS = 60000;

  function widgetUrl(id) { return `https://discord.com/api/guilds/${id}/widget.json`; }

  function topActivity(members) {
    const tally = {};
    (members || []).forEach(m => {
      if (m.game && m.game.name) tally[m.game.name] = (tally[m.game.name] || 0) + 1;
    });
    const entries = Object.entries(tally).sort((a, b) => b[1] - a[1]);
    return entries.length ? { name: entries[0][0], count: entries[0][1] } : null;
  }

  function initials(name) {
    return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2)
      .map(w => w[0].toUpperCase()).join('');
  }

  async function refresh() {
    try {
      const res = await fetch(widgetUrl(GUILD_ID), { cache: 'no-store' });
      if (!res.ok) throw new Error('status ' + res.status);
      const data = await res.json();

      document.getElementById('wName').textContent = data.name;

      const pill = document.getElementById('wPill');
      pill.textContent = 'live';
      pill.classList.remove('off');

      document.getElementById('wOnline').textContent = data.presence_count ?? '–';
      document.getElementById('wVoice').textContent = 0;
      document.getElementById('wActivity').textContent =
        'https://discord.widget.wtf';
    } catch (err) {
      document.getElementById('wName').textContent = 'Status unavailable';
      const pill = document.getElementById('wPill');
      pill.textContent = 'offline';
      pill.classList.add('off');
      document.getElementById('wOnline').textContent = '–';
      document.getElementById('wVoice').textContent = '–';
      document.getElementById('wActivity').textContent =
        'Widget not reachable — make sure Server Widget is enabled.';
    }
  }

  refresh();
  setInterval(refresh, POLL_MS);
})();
</script>
</body>
</html>
